openapi: 3.0.3
info:
  title: Doggo application
  description: |-
    This API aim to provide feature to manage and control robot dogs
  version: 1.0.0
servers:
  - url: http://localhost:3333
    description: Local server
security:
  - BearerAuth: [ ]
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Create an account
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login with email/password
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login result (with or without MFA challenge)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthSuccessResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
  /auth/login/2fa:
    post:
      tags:
        - Authentication
      summary: Complete login with TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
      responses:
        '200':
          description: Login completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
  /auth/password-reset:
    post:
      tags:
        - Authentication
      summary: Send password reset email
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /auth/2fa/setup:
    post:
      tags:
        - Authentication
      summary: Start TOTP enrollment setup
      responses:
        '200':
          description: TOTP setup data (including otpauth URI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetupResponse'
  /auth/2fa/verify:
    post:
      tags:
        - Authentication
      summary: Finalize TOTP enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpVerifyRequest'
      responses:
        '200':
          description: Two-factor enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpVerifyResponse'
  /auth/2fa/enrollments:
    post:
      tags:
        - Authentication
      summary: List current MFA enrollments
      responses:
        '200':
          description: Enrollment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentsResponse'
  /auth/2fa:
    delete:
      tags:
        - Authentication
      summary: Disable one MFA enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableMfaRequest'
      responses:
        '200':
          description: Two-factor disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpVerifyResponse'
  /auth/account:
    delete:
      tags:
        - Authentication
      summary: Delete current account (Firebase + local DB)
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /users:
    get:
      tags:
        - Users
      summary: List users
      responses:
        '200':
          description: Users list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
  /users/{id}:
    get:
      tags:
        - Users
      summary: Get one user by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Users
      summary: Update a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserUpdatedResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /dogs/users/{id}:
    get:
      tags:
        - Dogs
      summary: List active dogs owned by a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User dogs list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDogsResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{id}/dogs/adopt:
    post:
      tags:
        - Users
      summary: Attach a dog to a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageUserDogRequest'
      responses:
        '200':
          description: Dog adopted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: User or dog not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{id}/dogs/abandon:
    post:
      tags:
        - Users
      summary: Detach a dog from a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManageUserDogRequest'
      responses:
        '200':
          description: Dog abandoned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Active ownership, user or dog not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /dogs:
    get:
      tags:
        - Dogs
      summary: List robot dogs
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Dogs list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DogsListResponse'
    post:
      tags:
        - Dogs
      summary: Create a robot dog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRobotDogRequest'
      responses:
        '201':
          description: Dog created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotDogCreatedResponse'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /dogs/{id}:
    get:
      tags:
        - Dogs
      summary: Get one robot dog by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dog found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DogResponse'
        '404':
          description: Dog not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Dogs
      summary: Update a robot dog
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRobotDogRequest'
      responses:
        '204':
          description: Dog updated
        '404':
          description: Dog not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      tags:
        - Dogs
      summary: Delete a robot dog
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Dog deleted
        '404':
          description: Dog not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /users/dogs/assign:
    post:
      tags:
        - Users
      summary: Assign a user to a robot dog
      description: |-
        Allows an authenticated owner to add another user to a robot dog they own.
        The caller must have an active ownership of the target robot dog.
        Admins bypass the ownership check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignUserDogRequest'
      responses:
        '200':
          description: User assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Caller does not own this robot dog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Robot dog or target user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Target user is already an owner of this robot dog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/dogs/{id}:
    get:
      tags:
        - Users
      summary: List active owners of a robot dog
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dog owners list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotDogOwnersResponse'
        '404':
          description: Dog not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - firstname
        - lastname
        - email
        - password
      properties:
        firstname:
          type: string
          example: John
        lastname:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: robotdogprojetannuel@yopmail.com
        password:
          type: string
          minLength: 8
          example: SuperPassword123
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: robotdogprojetannuel@yopmail.com
        password:
          type: string
          minLength: 8
          example: SuperPassword123
    MfaLoginRequest:
      type: object
      required:
        - pendingCredential
        - mfaEnrollmentId
        - verificationCode
      properties:
        pendingCredential:
          type: string
          example: MFA_PENDING_CREDENTIAL
        mfaEnrollmentId:
          type: string
          example: enrollment-id
        verificationCode:
          type: string
          example: '123456'
    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: robotdogprojetannuel@yopmail.com
    TotpVerifyRequest:
      type: object
      required:
        - sessionInfo
        - verificationCode
      properties:
        sessionInfo:
          type: string
          example: SESSION_INFO
        verificationCode:
          type: string
          example: '123456'
        displayName:
          type: string
          example: Aegis
    DisableMfaRequest:
      type: object
      required:
        - mfaEnrollmentId
      properties:
        mfaEnrollmentId:
          type: string
          example: enrollment-id
    ManageUserDogRequest:
      type: object
      required:
        - serialNumber
      properties:
        serialNumber:
          type: string
    CreateRobotDogRequest:
      type: object
      required:
        - serialNumber
        - name
        - batteryLevel
      properties:
        serialNumber:
          type: string
          minLength: 3
          example: SN-001
        name:
          type: string
          minLength: 2
          example: Rex
        batteryLevel:
          type: integer
          minimum: 0
          maximum: 100
          example: 80
    UpdateRobotDogRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          example: Bolt
    AuthTokens:
      type: object
      required:
        - idToken
        - refreshToken
        - expiresIn
      properties:
        idToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: string
          example: '3600'
    AuthUser:
      type: object
      required:
        - uid
        - email
      properties:
        uid:
          type: string
        email:
          type: string
          format: email
    AuthSuccessResponse:
      type: object
      required:
        - mfaRequired
        - user
        - tokens
      properties:
        message:
          type: string
          example: Account created successfully
        mfaRequired:
          type: boolean
          example: false
        user:
          $ref: '#/components/schemas/AuthUser'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
    MfaEnrollment:
      type: object
      required:
        - mfaEnrollmentId
      properties:
        mfaEnrollmentId:
          type: string
        displayName:
          type: string
        enrolledAt:
          type: string
        totpInfo:
          type: object
          additionalProperties: true
    MfaChallengeResponse:
      type: object
      required:
        - mfaRequired
        - pendingCredential
        - mfaInfo
      properties:
        mfaRequired:
          type: boolean
          example: true
        pendingCredential:
          type: string
        mfaInfo:
          type: array
          items:
            $ref: '#/components/schemas/MfaEnrollment'
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Password reset email sent
    TotpSetup:
      type: object
      required:
        - sessionInfo
        - sharedSecret
        - verificationCodeLength
        - hashingAlgorithm
        - periodSec
        - otpauthUri
      properties:
        sessionInfo:
          type: string
        sharedSecret:
          type: string
        verificationCodeLength:
          type: integer
          example: 6
        hashingAlgorithm:
          type: string
          example: SHA1
        periodSec:
          type: integer
          example: 30
        otpauthUri:
          type: string
    TotpSetupResponse:
      type: object
      required:
        - message
        - setup
      properties:
        message:
          type: string
          example: Scan the QR URI in Aegis and confirm with a generated code
        setup:
          $ref: '#/components/schemas/TotpSetup'
    TotpVerifyResponse:
      type: object
      required:
        - message
        - tokens
      properties:
        message:
          type: string
        tokens:
          type: object
          required:
            - idToken
            - refreshToken
          properties:
            idToken:
              type: string
            refreshToken:
              type: string
            mfaEnrollmentId:
              type: string
    EnrollmentsResponse:
      type: object
      required:
        - enrollments
      properties:
        enrollments:
          type: array
          items:
            $ref: '#/components/schemas/MfaEnrollment'
    User:
      type: object
      required:
        - id
        - firstname
        - lastname
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        firstname:
          type: string
          example: John
        lastname:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: robotdogprojetannuel@yopmail.com
        role:
          type: string
          enum:
            - user
            - admin
        dogs:
          $ref: '#/components/schemas/RelatedCollectionLink'
    RelatedCollectionLink:
      type: object
      required:
        - count
        - href
      properties:
        count:
          type: integer
          example: 3
        href:
          type: string
          example: /dogs/users/7b27cc5b-e591-48f2-85ba-f29f96eb9971
    RobotDog:
      type: object
      required:
        - id
        - serialNumber
        - name
        - state
        - batteryLevel
        - lastHeartbeat
        - users
      properties:
        id:
          type: string
          format: uuid
        serialNumber:
          type: string
          example: SN-001
        name:
          type: string
          example: Rex
        state:
          type: string
          example: IDLE
        batteryLevel:
          type: integer
          example: 80
        lastHeartbeat:
          type: string
          format: date-time
        users:
          $ref: '#/components/schemas/RelatedCollectionLink'
    UsersListResponse:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    UserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    UpdateUserRequest:
      type: object
      properties:
        firstname:
          type: string
          minLength: 2
          maxLength: 100
          example: Jane
        lastname:
          type: string
          minLength: 2
          maxLength: 100
          example: Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        role:
          type: string
          enum:
            - user
            - admin
    UserUpdatedResponse:
      type: object
      required:
        - message
        - user
      properties:
        message:
          type: string
          example: User updated successfully
        user:
          $ref: '#/components/schemas/User'
    UserDogsResponse:
      type: object
      required:
        - dogs
      properties:
        dogs:
          type: array
          items:
            $ref: '#/components/schemas/RobotDog'
    DogsListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RobotDog'
        meta:
          type: object
          required:
            - total
            - perPage
            - currentPage
            - firstPage
            - lastPage
          properties:
            total:
              type: integer
            perPage:
              type: integer
            currentPage:
              type: integer
            firstPage:
              type: integer
            lastPage:
              type: integer
    DogResponse:
      type: object
      required:
        - dog
      properties:
        dog:
          $ref: '#/components/schemas/RobotDog'
    RobotDogCreatedResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: RobotDog created
    RobotDogOwnersResponse:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    AssignUserDogRequest:
      type: object
      required:
        - robotDogId
        - userId
      properties:
        robotDogId:
          type: string
          format: uuid
          example: 56a39d4d-b05d-42fb-a402-6782fc66dc3d
        userId:
          type: string
          format: uuid
          example: 7b27cc5b-e591-48f2-85ba-f29f96eb9971
    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: USER_NOT_FOUND
        message:
          type: string
          example: User not found
