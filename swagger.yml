openapi: 3.0.3
info:
  title: Doggo application
  description: |-
    This API aim to provide feature to manage and control robot dogs
  version: 1.0.0
servers:
  - url: http://localhost:3333
    description: Local server
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login result (with or without MFA challenge)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthSuccessResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
  /auth/login/2fa:
    post:
      tags:
        - Authentication
      summary: Complete login with TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaLoginRequest'
      responses:
        '200':
          description: Login completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
  /auth/password-reset:
    post:
      tags:
        - Authentication
      summary: Send password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /auth/2fa/setup:
    post:
      tags:
        - Authentication
      summary: Start TOTP enrollment setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdTokenRequest'
      responses:
        '200':
          description: TOTP setup data (including otpauth URI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetupResponse'
  /auth/2fa/verify:
    post:
      tags:
        - Authentication
      summary: Finalize TOTP enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpVerifyRequest'
      responses:
        '200':
          description: Two-factor enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpVerifyResponse'
  /auth/2fa/enrollments:
    post:
      tags:
        - Authentication
      summary: List current MFA enrollments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdTokenRequest'
      responses:
        '200':
          description: Enrollment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentsResponse'
  /auth/2fa:
    delete:
      tags:
        - Authentication
      summary: Disable one MFA enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableMfaRequest'
      responses:
        '200':
          description: Two-factor disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpVerifyResponse'

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - firstname
        - lastname
        - email
        - password
      properties:
        firstname:
          type: string
          example: John
        lastname:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: robotdogprojetannuel@yopmail.com
        password:
          type: string
          minLength: 8
          example: SuperPassword123
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: robotdogprojetannuel@yopmail.com
        password:
          type: string
          minLength: 8
          example: SuperPassword123
    MfaLoginRequest:
      type: object
      required:
        - pendingCredential
        - mfaEnrollmentId
        - verificationCode
      properties:
        pendingCredential:
          type: string
          example: MFA_PENDING_CREDENTIAL
        mfaEnrollmentId:
          type: string
          example: enrollment-id
        verificationCode:
          type: string
          example: '123456'
    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: robotdogprojetannuel@yopmail.com
    IdTokenRequest:
      type: object
      required:
        - idToken
      properties:
        idToken:
          type: string
          example: eyJhbGciOi...
    TotpVerifyRequest:
      type: object
      required:
        - idToken
        - sessionInfo
        - verificationCode
      properties:
        idToken:
          type: string
          example: eyJhbGciOi...
        sessionInfo:
          type: string
          example: SESSION_INFO
        verificationCode:
          type: string
          example: '123456'
        displayName:
          type: string
          example: Aegis
    DisableMfaRequest:
      type: object
      required:
        - idToken
        - mfaEnrollmentId
      properties:
        idToken:
          type: string
          example: eyJhbGciOi...
        mfaEnrollmentId:
          type: string
          example: enrollment-id
    AuthTokens:
      type: object
      required:
        - idToken
        - refreshToken
        - expiresIn
      properties:
        idToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: string
          example: '3600'
    AuthUser:
      type: object
      required:
        - uid
        - email
      properties:
        uid:
          type: string
        email:
          type: string
          format: email
    AuthSuccessResponse:
      type: object
      required:
        - mfaRequired
        - user
        - tokens
      properties:
        message:
          type: string
          example: Account created successfully
        mfaRequired:
          type: boolean
          example: false
        user:
          $ref: '#/components/schemas/AuthUser'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
    MfaEnrollment:
      type: object
      required:
        - mfaEnrollmentId
      properties:
        mfaEnrollmentId:
          type: string
        displayName:
          type: string
        enrolledAt:
          type: string
        totpInfo:
          type: object
          additionalProperties: true
    MfaChallengeResponse:
      type: object
      required:
        - mfaRequired
        - pendingCredential
        - mfaInfo
      properties:
        mfaRequired:
          type: boolean
          example: true
        pendingCredential:
          type: string
        mfaInfo:
          type: array
          items:
            $ref: '#/components/schemas/MfaEnrollment'
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Password reset email sent
    TotpSetup:
      type: object
      required:
        - sessionInfo
        - sharedSecret
        - verificationCodeLength
        - hashingAlgorithm
        - periodSec
        - otpauthUri
      properties:
        sessionInfo:
          type: string
        sharedSecret:
          type: string
        verificationCodeLength:
          type: integer
          example: 6
        hashingAlgorithm:
          type: string
          example: SHA1
        periodSec:
          type: integer
          example: 30
        otpauthUri:
          type: string
    TotpSetupResponse:
      type: object
      required:
        - message
        - setup
      properties:
        message:
          type: string
          example: Scan the QR URI in Aegis and confirm with a generated code
        setup:
          $ref: '#/components/schemas/TotpSetup'
    TotpVerifyResponse:
      type: object
      required:
        - message
        - tokens
      properties:
        message:
          type: string
        tokens:
          type: object
          required:
            - idToken
            - refreshToken
          properties:
            idToken:
              type: string
            refreshToken:
              type: string
            mfaEnrollmentId:
              type: string
    EnrollmentsResponse:
      type: object
      required:
        - enrollments
      properties:
        enrollments:
          type: array
          items:
            $ref: '#/components/schemas/MfaEnrollment'
