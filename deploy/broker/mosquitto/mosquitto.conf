# Dynamic Security : remplace password_file/acl_file. Directive globale (pas liée à un
# listener) : s'applique aux deux listeners ci-dessous. L'état des comptes/rôles est
# persisté dans mosquitto/data/dynamic-security.json (créé au premier démarrage avec
# un compte admin par défaut dont les identifiants sont affichés une seule fois dans
# les logs du conteneur — voir backend/docs/mqtt-dynamic-security-activation.md).
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Listener PRIVÉ (backend via VPC) — non chiffré, fermé sur Internet par firewall
listener 1883
allow_anonymous false

# Listener PUBLIC TLS (robots sur Internet)
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
allow_anonymous false

persistence true
persistence_location /mosquitto/data/
log_dest stdout
