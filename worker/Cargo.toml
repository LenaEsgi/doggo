[package]
name = "mission-report-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs"] }
lapin = "4.10"
futures-lite = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
printpdf = "0.12"
google-cloud-storage = "1.16"
anyhow = "1"
thiserror = "1"
