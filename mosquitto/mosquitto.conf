# Dynamic Security : remplace password_file/acl_file. Directive globale (pas liée à un
# listener) : s'applique à tous les listeners actifs ci-dessous, y compris le listener TLS
# une fois décommenté. L'état des comptes/rôles est persisté dans mosquitto/data/dynamic-security.json
# (créé au premier démarrage avec un compte admin par défaut dont les identifiants sont
# affichés une seule fois dans les logs du conteneur — voir backend/docs/mqtt-dynamic-security-activation.md).
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Listener non chiffré (réseau interne / dev uniquement)
listener 1883
allow_anonymous false

# Listener TLS (production) — désactivé tant qu'il n'y a pas de certificats dans mosquitto/certs/.
# Pour l'activer : déposer ca.crt/server.crt/server.key dans mosquitto/certs/ puis décommenter.
# listener 8883
# protocol mqtt
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate false

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
